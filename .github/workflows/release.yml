name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check version matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content PhoneRemote.csproj
          if ('v' + $project.Project.PropertyGroup.Version -ne $env:GITHUB_REF_NAME) { throw 'Tag and project version differ' }
      - name: Tests
        shell: pwsh
        run: ./test.ps1
      - name: Build standalone app
        shell: pwsh
        run: ./build.ps1 -PackageOnly
      - name: Package
        shell: pwsh
        run: |
          $bundle = 'dist/parallexity-win-x64'
          Copy-Item VERIFICATION.md $bundle
          $files = @('parallexity.exe','README.md','LICENSE','THIRD-PARTY-NOTICES.md','VERIFICATION.md','licenses') | ForEach-Object { Join-Path $bundle $_ }
          Compress-Archive -LiteralPath $files -DestinationPath dist/parallexity-win-x64.zip
          Copy-Item "$bundle/parallexity.exe" dist/parallexity-win-x64.exe
          $hash = (Get-FileHash dist/parallexity-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  parallexity-win-x64.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parallexity-win-x64
          path: |
            dist/parallexity-win-x64.zip
            dist/parallexity-win-x64.exe
            dist/SHA256SUMS.txt
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/parallexity-win-x64.zip dist/parallexity-win-x64.exe dist/SHA256SUMS.txt --verify-tag --title "parallexity $env:GITHUB_REF_NAME" --generate-notes
